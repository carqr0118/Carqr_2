<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CarQR</title><style>body{margin:0;font-family:Arial;background:url(bg.jpg);background-size:cover;background-position:center;background-repeat:no-repeat;min-height:100vh;display:flex;justify-content:center;align-items:center;}.logo{position:absolute;top:20px;left:20px;width:90px;}.card{background:rgba(0,0,0,0.85);padding:30px;border-radius:15px;width:320px;color:white;box-shadow:0 10px 40px rgba(0,0,0,0.8);}h2{text-align:center;margin-bottom:20px;color:#ffffff;}.info{margin:12px 0;padding:12px;background:rgba(255,255,255,0.05);border-radius:8px;border-left:4px solid #00c8ff;}.label{font-size:13px;color:#9fb3c8;}.value{font-size:18px;font-weight:600;color:#ffffff;margin-top:4px;}.numberPlate{margin:15px 0;padding:10px;text-align:center;background:white;color:black;font-size:20px;font-weight:bold;border-radius:6px;letter-spacing:2px;}.call{display:block;width:100%;text-align:center;padding:12px;margin-top:20px;background:#1db954;color:white;text-decoration:none;border-radius:8px;font-size:18px;font-weight:bold;}.call:hover{background:#19a44b;}</style></head><body><img src="logo.jpg" class="logo"><div class="card"><h2>CarQR ma'lumotlari</h2><div class="info"><div class="label">Ism Familya</div><div class="value" id="name"></div></div><div class="info"><div class="label">Mashina nomi</div><div class="value" id="car"></div></div><div class="info"><div class="label">Mashina raqami</div></div><div class="numberPlate" id="number"></div><div class="info"><div class="label">Telefon raqami</div><div class="value" id="phone"></div></div><a id="callBtn" class="call">Qo'ng'iroq qilish</a></div><script>let params = new URLSearchParams(window.location.search)let name = params.get("name")let car = params.get("car")let number = params.get("number")let phone = params.get("phone")document.getElementById("name").innerText = namedocument.getElementById("car").innerText = cardocument.getElementById("number").innerText = numberdocument.getElementById("phone").innerText = phonedocument.getElementById("callBtn").href = "tel:"+phone</script></body></html>
