<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CarQR</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet"><style>body{margin:0;font-family:'Poppins',sans-serif;background:url(bg.jpg);background-size:cover;background-position:center;min-height:100vh;display:flex;justify-content:center;align-items:center;}.logo{position:absolute;top:20px;left:20px;width:90px;}.card{background:rgba(0,0,0,0.75);padding:30px;border-radius:20px;width:340px;color:white;backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(0,0,0,0.8);}h2{text-align:center;margin-bottom:25px;font-weight:600;letter-spacing:1px;}.box{background:rgba(255,255,255,0.05);border:1px solid rgba(0,200,255,0.4);border-radius:12px;padding:12px 15px;margin-bottom:15px;}.label{font-size:13px;color:#8bdcff;margin-bottom:5px;}.value{font-size:18px;font-weight:500;}.numberPlate{background:rgba(255,255,255,0.08);border:2px solid #00c8ff;border-radius:10px;text-align:center;padding:12px;font-size:20px;font-weight:700;letter-spacing:2px;}.call{display:block;width:100%;text-align:center;padding:14px;margin-top:15px;background:linear-gradient(90deg,#00c853,#00e676);color:white;text-decoration:none;border-radius:10px;font-size:18px;font-weight:600;}.call:hover{opacity:0.9;}</style></head><body><img src="logo.jpg" class="logo"><div class="card"><h2>CarQR ma'lumotlari</h2><div class="box"><div class="label">Ism Familya</div><div class="value" id="name"></div></div><div class="box"><div class="label">Mashina nomi</div><div class="value" id="car"></div></div><div class="box"><div class="label">Mashina raqami</div><div class="numberPlate" id="number"></div></div><div class="box"><div class="label">Telefon raqami</div><div class="value" id="phone"></div></div><a id="callBtn" class="call">Qo'ng'iroq qilish</a></div><script>let params = new URLSearchParams(window.location.search)let name = params.get("name")let car = params.get("car")let number = params.get("number")let phone = params.get("phone")document.getElementById("name").innerText = namedocument.getElementById("car").innerText = cardocument.getElementById("number").innerText = numberdocument.getElementById("phone").innerText = phonedocument.getElementById("callBtn").href = "tel:"+phone</script></body></html>
