<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>CarQR yaratish</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
font-family:Arial;
background-image:url("bg.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:rgba(255,255,255,0.9);
padding:60px;
border-radius:20px;
text-align:center;
width:520px;
}

h1{
font-size:40px;
margin-bottom:25px;
}

input{
width:90%;
padding:15px;
font-size:22px;
margin:12px;
border-radius:8px;
border:1px solid #ccc;
}

button{
padding:15px 30px;
font-size:22px;
margin:10px;
border:none;
background:#ff5a36;
color:white;
border-radius:8px;
cursor:pointer;
}

#qrcode{
margin-top:25px;
}

</style>
</head>

<body>

<div class="box">

<h1>🚗 CarQR yaratish</h1>

<input id="name" placeholder="Ism"><br>
<input id="car" placeholder="Mashina markasi"><br>
<input id="number" placeholder="Mashina raqami"><br>
<input id="phone" placeholder="Telefon"><br>

<button onclick="makeQR()">QR yaratish</button>
<button onclick="downloadQR()">QR yuklab olish</button>

<div id="qrcode"></div>

</div>

<script>

let qrimg=""

function makeQR(){

let name=document.getElementById("name").value
let car=document.getElementById("car").value
let number=document.getElementById("number").value
let phone=document.getElementById("phone").value

let link="https://carqr0118.github.io/Carqr_2/create.html?name="
+encodeURIComponent(name)
+"&car="+encodeURIComponent(car)
+"&number="+encodeURIComponent(number)
+"&phone="+encodeURIComponent(phone)

document.getElementById("qrcode").innerHTML=""

new QRCode(document.getElementById("qrcode"),{
text:link,
width:250,
height:250
})

setTimeout(()=>{
let img=document.querySelector("#qrcode img")
if(img){qrimg=img.src}
},500)

}

function downloadQR(){

if(qrimg==""){
alert("Avval QR yarating")
return
}

let a=document.createElement("a")
a.href=qrimg
a.download="carqr.png"
a.click()

}

</script>

</body>
</html>
