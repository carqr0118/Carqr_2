<!DOCTYPE html><html><head><meta charset="UTF-8"><title>CarQR</title><style>body{margin:0;font-family:Arial;background:url(bg.jpg);background-size:cover;height:100vh;display:flex;justify-content:center;align-items:center;}.logo{position:absolute;top:20px;left:20px;width:120px;}.card{position:relative;z-index:2;background:white;padding:30px;border-radius:15px;width:320px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.4);}.title{margin-bottom:15px;}.info-box{background:#f5f5f5;padding:12px;margin:10px 0;border-radius:10px;font-size:16px;display:flex;justify-content:space-between;align-items:center;border-left:5px solid #ff4d4d;}.label{font-weight:bold;color:#333;}.value{color:#000;}.call-btn{display:block;margin-top:20px;padding:12px;background:#ff4d4d;color:white;text-decoration:none;border-radius:10px;font-size:18px;font-weight:bold;}</style></head><body><img src="logo.jpg" class="logo"><div class="card"><h2 class="title">CarQR ma'lumotlari</h2><div class="info-box"><span class="label">Ism Familya</span><span class="value" id="name"></span></div><div class="info-box"><span class="label">Mashina nomi</span><span class="value" id="car"></span></div><div class="info-box"><span class="label">Mashina raqami</span><span class="value" id="number"></span></div><div class="info-box"><span class="label">Telefon raqami</span><span class="value" id="phone"></span></div><a id="callButton" class="call-btn">📞 Qo'ng'iroq qilish</a></div><script>let params = new URLSearchParams(window.location.search)let name = params.get("name")let car = params.get("car")let number = params.get("number")let phone = params.get("phone")document.getElementById("name").innerText = namedocument.getElementById("car").innerText = cardocument.getElementById("number").innerText = numberdocument.getElementById("phone").innerText = phonelet callBtn = document.getElementById("callButton")callBtn.href = "tel:" + phone</script></body></html>
