<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>CarQR</title><style>body{margin:0;font-family:Arial;background:url(bg.jpg);background-size:cover;background-position:center;background-repeat:no-repeat;min-height:100vh;display:flex;justify-content:center;align-items:center;}.logo{position:absolute;top:20px;left:20px;width:120px;}.card{position:relative;z-index:2;background:white;padding:30px;border-radius:15px;width:320px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,0.4);}h2{text-align:center;margin-bottom:20px;}.info{margin:10px 0;font-size:16px;}.label{font-weight:bold;color:#555;}.value{font-size:18px;margin-top:2px;}.call{display:block;width:100%;text-align:center;padding:12px;margin-top:20px;background:#28a745;color:white;text-decoration:none;border-radius:8px;font-size:18px;}</style></head><body><img src="logo.jpg" class="logo"><div class="card"><h2>CarQR ma'lumotlari</h2><div class="info"><div class="label">Ism Familya</div><div class="value" id="name"></div></div><div class="info"><div class="label">Mashina nomi</div><div class="value" id="car"></div></div><div class="info"><div class="label">Mashina raqami</div><div class="value" id="number"></div></div><div class="info"><div class="label">Telefon raqami</div><div class="value" id="phone"></div></div><a id="callBtn" class="call">Qo'ng'iroq qilish</a></div><script>let params = new URLSearchParams(window.location.search)let name = params.get("name")let car = params.get("car")let number = params.get("number")let phone = params.get("phone")document.getElementById("name").innerText = namedocument.getElementById("car").innerText = cardocument.getElementById("number").innerText = numberdocument.getElementById("phone").innerText = phonedocument.getElementById("callBtn").href = "tel:"+phone</script></body></html>
