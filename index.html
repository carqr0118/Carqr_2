<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CarQR</title>

<style>

body{
margin:0;
font-family:Arial;
background:url(bg.jpg);
background-size:cover;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.logo{
position:absolute;
top:20px;
left:20px;
width:120px;
}

.card{
position:relative;
z-index:2;
background:white;
padding:30px;
border-radius:15px;
width:320px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

input{
width:90%;
padding:10px;
margin:6px;
border-radius:8px;
border:1px solid #ccc;
}

button{
padding:10px 20px;
background:#ff4d4d;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

canvas{
margin-top:15px;
display:none;
}

.download{
display:none;
margin-top:10px;
}

.error{
color:red;
font-size:12px;
display:block;
}

</style>
</head>

<body>

<img src="logo.jpg" class="logo">

<div class="card">

<h2>CarQR yaratish</h2>

<input id="name" placeholder="Ism Familya">
<small id="nameError" class="error"></small>

<input id="car" placeholder="Mashina nomi">
<small id="carError" class="error"></small>

<input id="number" placeholder="Mashina raqami">
<small id="numberError" class="error"></small>

<input id="phone" placeholder="Telefon raqam">
<small id="phoneError" class="error"></small>

<button onclick="createQR()">QR yaratish</button>

<br>

<canvas id="qr"></canvas>

<br>

<button class="download" onclick="downloadQR()">QR yuklab olish</button>

</div>

<script>

let logo = new Image()
logo.crossOrigin="anonymous"
logo.src="logo.jpg"

function createQR(){

let name=document.getElementById("name").value
let car=document.getElementById("car").value
let number=document.getElementById("number").value
let phone=document.getElementById("phone").value

document.getElementById("nameError").innerText=""
document.getElementById("carError").innerText=""
document.getElementById("numberError").innerText=""
document.getElementById("phoneError").innerText=""

let error=false

if(name==""){
document.getElementById("nameError").innerText="To'ldirilishi shart"
error=true
}

if(car==""){
document.getElementById("carError").innerText="To'ldirilishi shart"
error=true
}

if(number==""){
document.getElementById("numberError").innerText="To'ldirilishi shart"
error=true
}

if(phone==""){
document.getElementById("phoneError").innerText="To'ldirilishi shart"
error=true
}

if(error){
return
}

/* SIZNING SAYTINGIZ LINKI */

let link="https://carqr0118.github.io/Carqr_2/create.html?name="+encodeURIComponent(name)+
"&car="+encodeURIComponent(car)+
"&number="+encodeURIComponent(number)+
"&phone="+encodeURIComponent(phone)

let qr="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="+encodeURIComponent(link)

let canvas=document.getElementById("qr")
let ctx=canvas.getContext("2d")

let qrImage=new Image()
qrImage.crossOrigin="anonymous"

qrImage.onload=function(){

canvas.width=250
canvas.height=250

ctx.drawImage(qrImage,0,0,250,250)

let size=60
ctx.drawImage(logo,95,95,size,size)

}

qrImage.src=qr

canvas.style.display="block"
document.querySelector(".download").style.display="inline-block"

}

function downloadQR(){

let canvas=document.getElementById("qr")

let link=document.createElement("a")
link.download="carqr.png"
link.href=canvas.toDataURL("image/png")
link.click()

}

</script>

</body>
</html>
