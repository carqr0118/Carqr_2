<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>CarQR yaratish</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
font-family:Arial;
background-image:url("bg.jpg");
background-size:cover;
background-position:center;
margin:0;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
padding-top:120px;
}

.logo{
position:fixed;
top:20px;
left:20px;
width:90px;
}

.box{
background:rgba(255,255,255,0.9);
padding:40px;
border-radius:20px;
text-align:center;
width:90%;
max-width:420px;
}

h1{
font-size:34px;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
font-size:20px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
padding:14px;
font-size:20px;
margin-top:10px;
border:none;
background:#ff5a36;
color:white;
border-radius:8px;
cursor:pointer;
width:100%;
}

.error{
color:red;
font-size:16px;
}

/* QR */

#qrbox{
position:relative;
display:inline-block;
margin-top:20px;
}

#qrlogo{
position:absolute;
width:55px;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:5px;
border-radius:10px;
}

/* Fayl yuklash */

.filebox{
margin-top:10px;
}

.filelabel{
display:block;
background:#ddd;
padding:10px;
border-radius:6px;
cursor:pointer;
font-size:18px;
}

input[type=file]{
display:none;
}

</style>
</head>

<body>

<img src="logo.jpg" class="logo">

<div class="box">

<h1>🚗 CarQR yaratish</h1>

<input id="name" placeholder="Ism">
<div id="e1" class="error"></div>

<input id="car" placeholder="Mashina markasi">
<div id="e2" class="error"></div>

<input id="number" placeholder="Mashina raqami">
<div id="e3" class="error"></div>

<input id="phone" placeholder="Telefon">
<div id="e4" class="error"></div>

<div class="filebox">
<label class="filelabel" for="carimg">📷 Mashina rasmi yuklash (ixtiyoriy)</label>
<input type="file" id="carimg">
</div>

<button onclick="makeQR()">QR yaratish</button>

<button onclick="downloadQR()">QR yuklab olish</button>

<div id="qrbox">

<div id="qrcode"></div>

<img src="logo.jpg" id="qrlogo">

</div>

</div>

<script>

let qrimg=""

function makeQR(){

let name=document.getElementById("name").value
let car=document.getElementById("car").value
let number=document.getElementById("number").value
let phone=document.getElementById("phone").value

document.getElementById("e1").innerText=""
document.getElementById("e2").innerText=""
document.getElementById("e3").innerText=""
document.getElementById("e4").innerText=""

let ok=true

if(name==""){document.getElementById("e1").innerText="Katak to‘ldirilishi kerak";ok=false}
if(car==""){document.getElementById("e2").innerText="Katak to‘ldirilishi kerak";ok=false}
if(number==""){document.getElementById("e3").innerText="Katak to‘ldirilishi kerak";ok=false}
if(phone==""){document.getElementById("e4").innerText="Katak to‘ldirilishi kerak";ok=false}

if(!ok){return}

let link="https://carqr0118.github.io/Carqr_2/create.html?name="
+encodeURIComponent(name)
+"&car="+encodeURIComponent(car)
+"&number="+encodeURIComponent(number)
+"&phone="+encodeURIComponent(phone)

document.getElementById("qrcode").innerHTML=""

new QRCode(document.getElementById("qrcode"),{
text:link,
width:230,
height:230
})

setTimeout(()=>{
let img=document.querySelector("#qrcode img")
if(img){qrimg=img.src}
},500)

}

function downloadQR(){

if(qrimg==""){
alert("Avval QR yarating")
return
}

let a=document.createElement("a")
a.href=qrimg
a.download="carqr.png"
a.click()

}

</script>

</body>
</html>
