 if(window.QRCodeStyling)return Promise.resolve();
 if(qrLibraryPromise)return qrLibraryPromise;
 qrLibraryPromise=new Promise((resolve,reject)=>{
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js';
  s.onload=()=>window.QRCodeStyling?resolve():reject(new Error('QR dizayn kutubxonasi yuklanmadi.'));
  s.onerror=()=>reject(new Error('QR dizayn kutubxonasi yuklanmadi. Internetni tekshiring.'));
  document.head.appendChild(s);
 });
 return qrLibraryPromise;
}
