<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>CarQR</title>
<style>
body{
margin:0;
font-family:Arial;
background:url(bg.jpg);
background-size:cover;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}
.logo{
position:absolute;
top:20px;
left:20px;
width:120px;
}
.card{
position:relative;
z-index:2;
background:white;
padding:30px;
border-radius:15px;
width:320px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
input, .file-input{
width:90%;
padding:10px;
margin:6px;
border-radius:8px;
border:1px solid #ccc;
}
button{
padding:10px 20px;
background:#ff4d4d;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}
.error{
color:red;
font-size:12px;
display:block;
}
</style>
</head>
<body>

<img src="logo.jpg" class="logo">

<div class="card">
<h2>CarQR yaratish</h2>

<input id="name" placeholder="Ism">
<small id="nameError" class="error"></small>

<input id="car" placeholder="Mashina nomi">
<small id="carError" class="error"></small>

<input id="number" placeholder="Mashina raqami">
<small id="numberError" class="error"></small>

<input id="phone" placeholder="Telefon raqam">
<small id="phoneError" class="error"></small>

<!-- Mashina rasmi ixtiyoriy -->
<input type="file" id="carImg" class="file-input" accept="image/*">

<button onclick="goCreate()">QR yaratish</button>
</div>

<script>
let carImageBase64 = null;

// Fayl tanlash
document.getElementById("carImg").addEventListener("change", function(e){
    let file = e.target.files[0];
    if(file){
        let reader = new FileReader();
        reader.onload = function(ev){
            carImageBase64 = ev.target.result;
        }
        reader.readAsDataURL(file);
    } else {
        carImageBase64 = null;
    }
});

function goCreate(){
    let name = document.getElementById("name").value.trim();
    let car = document.getElementById("car").value.trim();
    let number = document.getElementById("number").value.trim();
    let phone = document.getElementById("phone").value.trim();

    document.getElementById("nameError").innerText="";
    document.getElementById("carError").innerText="";
    document.getElementById("numberError").innerText="";
    document.getElementById("phoneError").innerText="";

    let error=false;
    if(name==""){document.getElementById("nameError").innerText="To'ldirilishi shart"; error=true;}
    if(car==""){document.getElementById("carError").innerText="To'ldirilishi shart"; error=true;}
    if(number==""){document.getElementById("numberError").innerText="To'ldirilishi shart"; error=true;}
    if(phone==""){document.getElementById("phoneError").innerText="To'ldirilishi shart"; error=true;}
    if(error) return;

    // URL encode bilan create.html ga o'tish
    let url = "create.html?name="+encodeURIComponent(name)+
              "&car="+encodeURIComponent(car)+
              "&number="+encodeURIComponent(number)+
              "&phone="+encodeURIComponent(phone);

    if(carImageBase64){
        url += "&img="+encodeURIComponent(carImageBase64);
    }

    window.location.href = url;
}
</script>
</body>
</html>
