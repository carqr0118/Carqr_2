<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><title>CarQR - Ma’lumotlar</title><style>body{    font-family:Arial, sans-serif;    background:#f0f0f0;    margin:0;    padding:50px 10px;    display:flex;    justify-content:center;}.card{    background:white;    padding:30px 40px;    border-radius:20px;    width:100%;    max-width:500px;    box-shadow:0 5px 20px rgba(0,0,0,0.25);    text-align:center;}.logo{    display:block;    margin:0 auto 20px;    width:80px;}h2{    font-size:28px;    margin-bottom:25px;}.info-block{    margin-bottom:20px;    padding:15px;    border:1px solid #ddd;    border-radius:12px;    background:#fafafa;    text-align:left;}.info-block p{    margin:0;    font-size:18px;}.number{    font-weight:bold;}.carimg{    width:100%;    margin-top:20px;    border-radius:12px;    display:none;}.buttons{    margin-top:25px;    display:flex;    flex-direction:column;    gap:12px;}.button{    padding:15px;    font-size:18px;    border:none;    border-radius:10px;    color:white;    cursor:pointer;    text-decoration:none;    display:block;    background:#ff5a36;}.button:hover{    background:#e04e2d;}canvas{    margin-top:20px;    border:1px solid #ccc;}</style></head><body><div class="card"><img src="logo.jpg" class="logo"><h2>Mashina egasi ma’lumotlari</h2><div class="info-block"><p id="nameText"></p></div><div class="info-block"><p id="carText"></p></div><div class="info-block"><p id="numberText" class="number"></p></div><div class="info-block"><p id="phoneText"></p></div><img id="carimg" class="carimg"><canvas id="qr"></canvas><div class="buttons">    <a id="call" class="button">📞 Qo‘ng‘iroq qilish</a>    <a id="back" class="button" href="index.html">⬅ Orqaga</a></div></div><script>let params = new URLSearchParams(window.location.search);let name = params.get("name") || "—";let car = params.get("car") || "—";let number = params.get("number") || "—";let phone = params.get("phone") || "—";let img = params.get("img");document.getElementById("nameText").innerText = "Ism: "+name;document.getElementById("carText").innerText = "Mashina: "+car;document.getElementById("numberText").innerText = "Raqam: "+number;document.getElementById("phoneText").innerText = "Telefon: "+phone;document.getElementById("call").href = "tel:"+phone;if(img){    let carImgElem = document.getElementById("carimg");    carImgElem.src = img;    carImgElem.style.display = "block";}// QR yaratishlet canvas = document.getElementById("qr");let ctx = canvas.getContext("2d");let qrData = Ism:${name} Mashina:${car} Raqam:${number} Telefon:${phone};let qrImage = new Image();qrImage.crossOrigin="anonymous";qrImage.onload=function(){    canvas.width=250;    canvas.height=250;    ctx.drawImage(qrImage,0,0,250,250);}qrImage.src = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="+encodeURIComponent(qrData);canvas.style.display="block";</script></body></html>
